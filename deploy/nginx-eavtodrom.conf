# eAvtodrom on its own domain: eavtodrom.uz (prod) and dev.eavtodrom.uz (dev), each with its admin panel
# (admin. / dev-admin.); the same Go servers as the sslip.io addresses. HTTPS is added by certbot
# (deploy/eavtodrom-switch.sh), which turns these port 80 blocks into 443 ones with a redirect.
map $host $eav_port { eavtodrom.uz 8092; admin.eavtodrom.uz 8092; dev.eavtodrom.uz 8091; dev-admin.eavtodrom.uz 8091; }
map $host $eav_admin { eavtodrom.uz admin.eavtodrom.uz; dev.eavtodrom.uz dev-admin.eavtodrom.uz; }
server {
    listen 80;
    listen [::]:80;
    server_name www.eavtodrom.uz;
    return 301 $scheme://eavtodrom.uz$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name eavtodrom.uz dev.eavtodrom.uz;
    client_max_body_size 210m;
    location = /admin.html { return 301 $scheme://$eav_admin/; }
    gzip_proxied any;
    gzip_types text/css application/javascript application/json model/gltf-binary application/octet-stream image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:$eav_port;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name admin.eavtodrom.uz dev-admin.eavtodrom.uz;
    client_max_body_size 210m;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = / { rewrite ^ /admin.html last; }
    location / {
        proxy_pass http://127.0.0.1:$eav_port;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
