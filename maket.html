<!doctype html>
<html><head><meta charset="utf-8"><title>Poligon maketi</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden;font:13px sans-serif;color:#fff}
#bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
button{padding:6px 10px;border:0;border-radius:6px;background:#2a2f36;color:#fff;cursor:pointer}</style></head>
<body><div id="bar"></div><script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
import { Sky } from "three/examples/jsm/objects/Sky.js";
import { buildFull } from "/src/world/tracks.js";
import { buildWorldMeshes } from "/src/render/worldMesh.js";
const W = buildFull({ length: 4.4, rOh: 0.9, k: 1 });
const { group } = buildWorldMeshes(W, "high");
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.append(r.domElement);
// the same light as the game (src/render/view.js): physical sky, warm sun with soft shadows over the whole ground
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.72; r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(); sc.add(group); sc.fog = new THREE.Fog(0xb7cbe0, 250, 900);
const SUN = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(52), THREE.MathUtils.degToRad(135));
const sky = new Sky(); sky.scale.setScalar(2000); const su = sky.material.uniforms;
su.turbidity.value = 2.2; su.rayleigh.value = 0.9; su.mieCoefficient.value = 0.003; su.mieDirectionalG.value = 0.85; su.sunPosition.value.copy(SUN); sc.add(sky);
sc.add(new THREE.HemisphereLight(0xdfeaff, 0x5a6a3e, 1.3));
{ const pm = new THREE.PMREMGenerator(r), es = new THREE.Scene(), s2 = new Sky(); s2.scale.setScalar(50);
  for (const k of ["turbidity", "rayleigh", "mieCoefficient", "mieDirectionalG"]) s2.material.uniforms[k].value = su[k].value;
  s2.material.uniforms.sunPosition.value.copy(SUN); es.add(s2); sc.environment = pm.fromScene(es, 0.02).texture; sc.environmentIntensity = 0.75; }
const sun = new THREE.DirectionalLight(0xfff1dc, 3.6); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -110, right: 110, top: 110, bottom: -110, near: 1, far: 500 }); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.05;
sun.position.copy(SUN).multiplyScalar(250); sc.add(sun, sun.target);
group.traverse(o => { if (o.isMesh) { if (!o.geometry.boundingSphere) o.geometry.computeBoundingSphere(); o.castShadow = o.castShadow || o.geometry.boundingSphere.radius < 30; o.receiveShadow = true; } });
const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.3, 3000), ctl = new OrbitControls(cam, r.domElement);
const b = W.bounds, cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2;
// world (x,y) -> three (x, h, -y) or similar: find the mapping from the group by using the same one as View
const to = (x, y, h = 0) => new THREE.Vector3(x, h, y);
const go = (x, y, h, tx, ty, th) => { cam.position.copy(to(x, y, h)); ctl.target.copy(to(tx, ty, th)); ctl.update(); };
const views = { "Tepadan": () => go(cx, cy + 0.01, 190, cx, cy, 0), "Qiya": () => go(cx, cy + 190, 150, cx, cy, 0), "Chorraha": () => go(0, -40, 30, 0, 0, 0), "Estakada": () => { const r = W.ramps[0].pose, c = Math.cos(r.th), n = Math.sin(r.th), m = 20; go(r.x + c * (m - 6) + n * 14, r.y + n * (m - 6) - c * 14, 9, r.x + c * (m + 6), r.y + n * (m + 6), 0.5); }, "Zigzag": () => go(-40, -22, 28, -40, -25, 0), "Start": () => { const r = W.start, c = Math.cos(r.th), n = Math.sin(r.th); go(r.x - c * 12 + n * 8, r.y - n * 12 - c * 8, 12, r.x + c * 14, r.y + n * 14, 0); }};
const bar = document.getElementById("bar");
for (const k in views) { const e = document.createElement("button"); e.textContent = k; e.onclick = views[k]; bar.append(e); }
if (location.hash.startsWith("#cam=")) { const v = location.hash.slice(5).split(",").map(Number); go(v[0], v[2], v[1], v[3], v[5], v[4]); } else views.Qiya();
window.shot = v => go(v[0], v[2], v[1], v[3], v[5], v[4]);
addEventListener("resize", () => { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
r.setAnimationLoop(() => r.render(sc, cam));
</script></body></html>
