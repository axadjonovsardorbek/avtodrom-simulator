# /etc/nginx/sites-available/avtodrom  (then: ln -s ../sites-available/avtodrom /etc/nginx/sites-enabled/)
# api.example.uz -> the Go server on 127.0.0.1:8080. HTTPS by certbot: certbot --nginx -d api.example.uz
server {
    listen 80;
    server_name api.example.uz;

    client_max_body_size 210m;          # advertising videos up to 200 MB

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;    # uploads stream straight to the server
        proxy_read_timeout 300s;
    }
}
