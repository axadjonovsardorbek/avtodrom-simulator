# The simulator, its server and PostgreSQL:  docker compose up -d --build
# Settings come from .env next to this file (copy .env.docker.example). Site: http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: avtodrom
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avtodrom}
      POSTGRES_DB: avtodrom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avtodrom"]
      interval: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://avtodrom:${DB_PASSWORD:-avtodrom}@db:5432/avtodrom?sslmode=disable
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
      ADMINS: ${ADMINS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      DEV_LOGIN: ${DEV_LOGIN:-}
      INPAY_MERCHANT_ID: ${INPAY_MERCHANT_ID:-}
      INPAY_MERCHANT_TOKEN: ${INPAY_MERCHANT_TOKEN:-}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
